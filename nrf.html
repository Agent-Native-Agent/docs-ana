<style>
/* 한국어는 단어 중간에서 끊지 않는다(띄어쓰기에서 줄을 바꾼다). 칸보다 긴 한 단어만 어쩔 수 없을 때 끊는다 */
#paper { word-break: keep-all; overflow-wrap: break-word; }
/* 아이폰 사파리의 글자 자동 확대를 끈다 — 줄여 보인 문서의 작은 글자(꼬리말 등)가 커지지 않게 */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
/* 화면 결은 review-ana(review.html)에 맞춘다: 종이색 바탕 · 흰 문서 · 오른쪽 메모 줄 */
:root {
  --bg: #e9e7e2; --panel: #ffffff; --ink: #1d1f23; --ink2: #5b606a; --ink3: #8c919b; --line: #dedbd4;
  --accent: #3b5bdb; --accent-ink: #fff; --col: #faf9f6; --shadow: 0 1px 2px rgba(0,0,0,.06), 0 8px 28px rgba(0,0,0,.10);
  --tb-h: 60px; --rail-w: 300px;
  --a0: #d6336c; --a1: #1c7ed6; --a2: #2f9e44; --a3: #e8590c; --a4: #7048e8; --a5: #0c8599; --a6: #a61e4d; --a7: #5c940d;
}
:root { color-scheme: light; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif; }
button { font: inherit; color: inherit; cursor: pointer; }
[hidden] { display: none !important; }

/* ---------- 툴바: 한 벌의 모던 컨트롤(높이 36 · 둥근 10 · 테두리 없음 · 아이콘+글) ---------- */
#tb { position: fixed; inset: 0 0 auto 0; min-height: 60px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; row-gap: 6px; padding: 9px 16px; background: rgba(255,255,255,.92); backdrop-filter: saturate(1.6) blur(14px); -webkit-backdrop-filter: saturate(1.6) blur(14px); border-bottom: 1px solid rgba(0,0,0,.06); z-index: 50; }
#tb .brand { display: flex; align-items: center; gap: 9px; font-weight: 800; font-size: 15px; letter-spacing: -.02em; margin-right: 8px; white-space: nowrap; color: var(--a-text); }
#tb .brand img { width: 28px; height: 28px; border-radius: 8px; }
#tb .brand small { font-weight: 600; color: var(--a-text-weak); font-size: 13px; }
.tb-break { display: none; }
/* 휴대폰: 두 줄 — 위 줄 = 로고 · 문서 고르기 · 올리기 · 프로필, 아래 줄 = 보기 전환 · 내려받기 · 공유 · Chip */
@media (max-width: 700px) {
  #tb { flex-wrap: wrap; height: auto; padding: 8px 12px; row-gap: 8px; }
  #tb > * { order: 5; }
  #tb > #brandBtn { order: 0; } #tb > .pickWrap { order: 1; flex: 1 1 auto; } .pick { max-width: none; width: 100%; } #tb > #upBtn { order: 2; } #tb > #meWrap { order: 3; }
  #tb > .tb-break { display: block; order: 4; flex-basis: 100%; height: 0; }
  #tb > .spacer { order: 6; } #tb > #viewWrap, #tb > #dlMenu, #tb > #refWrap, #tb > #asWrap, #tb > #shareWrap, #tb > #chipBtn { order: 7; }
  #tb > #finalBtn { order: 5; }
  #tb > #chipBtn { padding: 0 6px; gap: 0; font-size: 0; }
  #tb #refPop .rf a { flex: 1 1 calc(100% - 60px); }
  #tb #refPop .rf > button.mini:first-of-type { margin-left: auto; }
  #docPop { position: fixed; left: 12px; right: 12px; width: auto; top: 52px; }
  #sharePop, #dlList, #refPop, #asPop { position: fixed; left: 12px; right: 12px; width: auto; top: 100px; }
}
.tb-div { width: 1px; height: 20px; background: var(--a-line); margin: 0 6px; flex: 0 0 auto; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; padding: 0 13px; border: 0; border-radius: 10px; background: var(--a-surface-3); color: var(--a-text-2); font-size: 13.5px; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; transition: background .12s, color .12s, box-shadow .12s, transform .06s; flex: 0 0 auto; text-decoration: none; }
.btn svg { width: 17px; height: 17px; flex: 0 0 auto; }
.btn:hover { background: var(--a-line); }
.btn:active { transform: scale(.97); }
.btn:focus-visible, .seg button:focus-visible, .pick:focus-visible { outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--acc) 35%, transparent); }
.btn.primary { background: var(--acc); color: #fff; }
.btn.primary:hover { background: var(--acc-strong); }
.btn.soft { background: var(--acc-weak); color: var(--acc-strong); }
.btn.soft:hover { background: color-mix(in srgb, var(--acc) 20%, #fff); }
.btn.ghost { background: transparent; }
.btn.ghost:hover { background: var(--a-surface-3); }
.spacer { flex: 1; }
/* 문서 고르기 */
.pickWrap { position: relative; min-width: 0; flex: 0 1 auto; display: flex; }
.pick { display: inline-flex; align-items: center; gap: 8px; height: 36px; max-width: min(340px, 100%); min-width: 0; padding: 0 10px 0 11px; border: 0; border-radius: 10px; background: var(--a-surface-3); color: var(--a-text); font-size: 13.5px; font-weight: 700; transition: background .12s; }
.pick:hover { background: var(--a-line); }
.pick .ic { width: 17px; height: 17px; color: var(--a-text-weak); flex: 0 0 auto; }
.pick .lb { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.pick .chev { width: 14px; height: 14px; opacity: .5; flex: 0 0 auto; }
/* 공통 팝오버 */
.pop { position: absolute; top: 44px; z-index: 80; background: #fff; border: 1px solid rgba(0,0,0,.06); border-radius: 14px; box-shadow: 0 12px 36px rgba(15,23,42,.14), 0 2px 6px rgba(15,23,42,.06); padding: 6px; animation: popIn .12s ease-out; }
@keyframes popIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
.pop .pi { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 10px; border: 0; background: none; border-radius: 10px; font-size: 13.5px; font-weight: 600; color: var(--a-text); text-align: left; text-decoration: none; }
.pop .pi:hover { background: var(--a-surface-2); }
.pop .pi.on { background: var(--acc-weak); }
.pop .pi.off { opacity: .45; pointer-events: none; }
.pop .pi svg { width: 17px; height: 17px; color: var(--a-text-weak); flex: 0 0 auto; }
.pop .pi .t { flex: 1; min-width: 0; }
.pop .pi .t b { display: block; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pop .pi .t small { display: block; font-size: 12px; font-weight: 500; color: var(--a-text-weak); margin-top: 1px; }
.pop .sep { height: 1px; background: var(--a-line-2); margin: 5px 4px; }
.fmt { flex: 0 0 auto; font-size: 10.5px; font-weight: 800; letter-spacing: .02em; padding: 3px 6px; border-radius: 6px; background: #E8F1FE; color: #1B64DA; }
.fmt.hwp { background: #FFF2E5; color: #C2410C; }
.fmt.pdf { background: #FDECEC; color: #C0392B; } .fmt.pptx { background: #FFF0E6; color: #C2410C; } .fmt.xlsx, .fmt.csv { background: #E6F6EC; color: #15803D; } .fmt.html, .fmt.htm { background: #EAF2FF; color: #1D4ED8; } .fmt.txt, .fmt.md { background: #EEF0F3; color: #4B5563; }
.p[data-m]::before { content: attr(data-m) '\00a0'; display: inline-block; min-width: var(--mw, 0); text-indent: 0; }
#docPop { left: 0; width: 380px; max-width: calc(100vw - 24px); }

body.viewonly #fmtBar, body.viewonly #cellBar, body.viewonly .runai, body.viewonly .thr textarea, body.viewonly .card .f button, body.viewonly [data-x="memomode"] { display: none !important; }
#sharePop .gst .gl { font-size: 12.5px; color: var(--a-text-weak); white-space: nowrap; align-self: center; } #sharePop .gst select.inp { flex: 1; }
#dlList { right: 0; width: 290px; } #dlList .hd { padding: 6px 10px 4px; font-size: 11.5px; font-weight: 700; color: var(--a-text-weak); } #dlList .xn { display: block; color: #137333 !important; font-weight: 600; }
#viewPop { right: 0; width: 250px; }
#viewPop .zm { display: flex; align-items: center; gap: 6px; padding: 6px 6px 8px; }
#viewPop .zm button { width: 34px; height: 34px; border: 1px solid var(--a-line); border-radius: 10px; background: #fff; font-size: 18px; font-weight: 700; color: var(--a-text); line-height: 1; }
#viewPop .zm button:hover { background: var(--a-surface-2); }
#viewPop .zm b { flex: 1; text-align: center; font-size: 14px; font-variant-numeric: tabular-nums; }

#viewPop .pi .ck { margin-left: auto; visibility: hidden; color: var(--acc); }
#viewPop .pi.on .ck { visibility: visible; }
/* 메모를 팝업으로: 오른쪽 줄을 없애고, 누른 변경의 카드만 그 자리 아래에 띄운다 */
body.memo-pop #rail { position: static; flex: 0 0 0; width: 0; min-height: 0 !important; }
body.memo-pop #wires, body.memo-pop #railEmpty { display: none; }
body.memo-pop .card:not(.on) { display: none; }
body.memo-pop .card.on { right: auto; z-index: 30; box-shadow: 0 14px 40px rgba(15,23,42,.22), 0 2px 6px rgba(15,23,42,.08); }

/* 변경 표시 | 최종본 */
.seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: 11px; background: var(--a-surface-3); flex: 0 0 auto; }
.seg button { height: 30px; padding: 0 12px; border: 0; border-radius: 8px; background: none; color: var(--a-text-weak); font-size: 13px; font-weight: 700; white-space: nowrap; transition: background .12s, color .12s, box-shadow .12s; }
.seg button:hover { color: var(--a-text); }
.seg button.on { background: #fff; color: var(--a-text); box-shadow: 0 1px 2px rgba(15,23,42,.1), 0 1px 6px rgba(15,23,42,.06); }
/* 참여자 */
#tb > #legend, #tb > #tbDiv { display: none !important; }
#fmtBar .fmtView { margin-left: auto; position: relative; }
#fmtBar .fmtView .btn { height: 30px; }
#fmtBar .fmtView .pop { right: 0; left: auto; top: 36px; z-index: 120; }

#legend { display: flex; gap: 4px; align-items: center; overflow: hidden; margin-right: 4px; }
.who { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px 0 4px; font-size: 12.5px; color: var(--a-text-weak); white-space: nowrap; border-radius: 999px; background: var(--a-surface-2); }
.who i { width: 22px; height: 22px; border-radius: 50%; background: color-mix(in srgb, var(--c) 18%, #fff); color: var(--c); font-style: normal; font-size: 11px; font-weight: 800; display: grid; place-items: center; }
.who b { font-weight: 700; color: var(--a-text); }
.menu { position: relative; }
/* 입력칸 */
.inp { height: 38px; border: 1px solid var(--a-line); border-radius: 10px; padding: 0 12px; font: inherit; font-size: 13.5px; background: var(--a-surface-2); color: var(--a-text); outline: none; transition: border-color .12s, box-shadow .12s, background .12s; }
.inp:focus { background: #fff; border-color: var(--acc); box-shadow: 0 0 0 3px color-mix(in srgb, var(--acc) 22%, transparent); }

#scroll { position: fixed; inset: var(--tb-h) 0 0 0; overflow: auto; }
#stage { position: relative; width: max-content; min-width: 100%; display: flex; justify-content: center; gap: 22px; padding: 26px 22px 120px; }
#paper { position: relative; background: var(--panel); box-shadow: var(--shadow); border-radius: 2px; flex: 0 0 auto; font-family: "함초롬바탕", "HCR Batang", "Noto Serif KR", "바탕", Batang, serif; line-height: 1.6; color: #111; }
#rail { position: relative; flex: 0 0 var(--rail-w); width: var(--rail-w); }
#wires { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }

.sec { padding-top: 1px; }
.p { position: relative; min-height: 1.2em; white-space: pre-wrap; overflow-wrap: anywhere; outline: none; border-radius: 2px; tab-size: 4; }
.p:focus { background: rgba(59, 91, 219, .06); box-shadow: -3px 0 0 rgba(59, 91, 219, .5); }
.p.added { box-shadow: -3px 0 0 var(--c); }
.p.added:empty::before, .p.added.blank::before { content: "새 문단"; color: var(--ink3); font-size: 11px; font-family: system-ui, sans-serif; opacity: .7; pointer-events: none; }
table.t { border-collapse: collapse; margin: 3px 0; table-layout: fixed; max-width: none; }
table.t td { border: var(--bw, 1px) solid #333; padding: 2px 5px; vertical-align: middle; }
.box { border: 1px solid #555; padding: 4px 6px; margin: 3px 0; display: inline-block; vertical-align: top; }
.note { border-top: 1px solid #999; margin: 3px 0 3px 12px; font-size: .85em; color: #333; }
img.pic { display: block; max-width: 100%; margin: 3px 0; }
/* Word 계열: 쪽마다 용지 한 장 */
#paper.paged { background: none; box-shadow: none; display: flex; flex-direction: column; align-items: center; gap: 16px; font-family: 'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Noto Sans CJK KR',sans-serif; line-height: 1.35; }
.sheet { position: relative; box-sizing: border-box; background: var(--panel); box-shadow: var(--shadow); border-radius: 2px; overflow: hidden; }

.p.rtab { display: flex; flex-wrap: wrap; align-items: baseline; }

#pageInd { position: fixed; right: 18px; bottom: 16px; z-index: 45; height: 28px; padding: 0 12px; border-radius: 14px; background: rgba(29,31,35,.82); color: #fff; font-size: 12px; font-weight: 700; display: flex; align-items: center; font-variant-numeric: tabular-nums; pointer-events: none; }
#pageInd[hidden] { display: none; }
/* 왼쪽: 고친 곳 목록 */
/* 왼쪽 사이드바: 문서 영역 밖, 창 왼쪽에 붙는다. 「도구 열기」를 끄면 숨긴다 */
#nav { position: fixed; left: 0; top: var(--tb-h); bottom: 0; width: var(--navw, 268px); overflow: auto; background: #fff; border-right: 1px solid rgba(0,0,0,.08); padding: 10px 8px 60px; font-size: 12.5px; z-index: 30; }

/* 서식을 바꾼 글: 변경 표시 보기에서 작성자 색으로 옅게 깔린다 */

ins.tc { text-decoration: underline; text-decoration-thickness: 1.5px; text-underline-offset: 2px; color: var(--c); background: color-mix(in srgb, var(--c) 11%, transparent); border-radius: 2px; }
del.tc { text-decoration: line-through; text-decoration-thickness: 1.5px; color: var(--c); opacity: .78; cursor: default; }
.tc.on { outline: 2px solid var(--c); outline-offset: 1px; opacity: 1; }
.p.gone { background: repeating-linear-gradient(-45deg, transparent 0 6px, rgba(0,0,0,.03) 6px 12px); }
.p.pdel::before { content: "↵ 지운 줄"; color: var(--c); text-decoration: line-through; font-size: 11px; font-family: system-ui, sans-serif; opacity: .8; cursor: pointer; text-indent: 0; }
.p.pdel.on { outline: 2px solid var(--c); outline-offset: 1px; }

.seg.vt button.on i::after { content: ''; position: absolute; left: 3.5px; top: 0.5px; width: 3.5px; height: 7px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg); }

.card { position: absolute; left: 0; right: 0; background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--c); border-radius: 10px; padding: 9px 11px; font-size: 13px; box-shadow: 0 1px 2px rgba(0,0,0,.05); transition: top .12s; }
.card.on { box-shadow: var(--shadow); border-color: var(--c); z-index: 5; }
/* 카드는 기본으로 한 줄(이름 · 종류 · 고친 글 · 코멘트 수)로 접혀 있고, 누르거나 그 문장을 누르면 펼쳐진다 */
.card .one { display: flex; align-items: center; gap: 6px; font-size: 12.5px; min-width: 0; cursor: pointer; }
.card .one b { color: var(--c); font-weight: 700; flex: 0 0 auto; max-width: 5.5em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .one .k { flex: 0 0 auto; padding: 0 6px; border-radius: 999px; background: var(--col); border: 1px solid var(--line); font-size: 10.5px; color: var(--ink2); }

.card .one .sn del { color: var(--ink3); }
.card .one .sn ins { text-decoration: underline; color: var(--c); }
.card .one .cc { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 3px; padding: 1px 7px; border-radius: 999px; background: color-mix(in srgb, var(--c) 14%, #fff); color: var(--c); font-size: 11px; font-weight: 800; }
.card .one .cc svg { width: 12px; height: 12px; }
.card:not(.on) { padding: 6px 10px; cursor: pointer; }
.card:not(.on):hover { border-color: var(--c); }
.card:not(.on) > :not(.one) { display: none; }
.card.on > .one { display: none; }
.card.on .h { cursor: pointer; }
.card .h { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink3); }
.card .h b { color: var(--c); font-weight: 700; font-size: 13px; }
.card .h .k { margin-left: auto; padding: 1px 7px; border-radius: 999px; background: var(--col); border: 1px solid var(--line); font-size: 11px; color: var(--ink2); }
.card .d { margin: 6px 0 2px; line-height: 1.5; overflow-wrap: anywhere; }
.card .d del { color: var(--ink3); }
.card .d ins { text-decoration: underline; color: var(--c); }
.card .cm { margin-top: 7px; padding: 6px 8px; background: var(--col); border-radius: 8px; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; }

.card textarea { width: 100%; margin-top: 8px; border: 1px solid var(--a-line); border-radius: 10px; padding: 7px 10px; font: inherit; font-size: 13px; resize: none; height: 34px; background: var(--a-surface-2); transition: height .12s, border-color .12s, box-shadow .12s, background .12s; }
.card textarea:focus { outline: none; background: #fff; border-color: var(--acc); box-shadow: 0 0 0 3px color-mix(in srgb, var(--acc) 22%, transparent); height: 62px; }
.card .f { display: flex; gap: 6px; margin-top: 6px; justify-content: flex-end; }

.card .f button:hover { background: var(--a-surface-3); color: var(--a-text); }
.card .f button:hover { color: var(--ink); }
.card .f button.go { color: var(--accent); font-weight: 700; }
#rail .card.resolved { opacity: .62; } #rail .card.resolved.on { opacity: 1; }
.card .rsd { display: inline-block; padding: 0 6px; border-radius: 999px; background: #E6F4EA; color: #137333; font-size: 11px; font-weight: 700; margin: 0 4px; white-space: nowrap; }

#railEmpty { position: absolute; left: 0; right: 0; top: 0; padding: 14px; border: 1px dashed #cfcbc1; border-radius: 10px; color: var(--ink3); font-size: 13px; line-height: 1.6; }

<script>
'use strict';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const PX = (hu) => hu / 75;                       // HWPUNIT(1/7200in) → px(96dpi)
const S = { actAs: null, tables: {}, tbl: new Map(), id: null, doc: null, view: null, paras: {}, comments: [], changes: [], authors: [], order: [], rev: 0, nodes: new Map(), els: new Map(), me: null, active: null, final: false, docs: [] };

// 손님(암호 입장) 토큰: 이 브라우저에 보관하고, 요청마다 헤더(주소로 여는 것은 ?g=)에 싣는다
const G = { token: '', doc: '' };
try { const g = JSON.parse(localStorage.getItem('nrf-guest') || 'null'); if (g && g.token) Object.assign(G, g); } catch {}
const gq = (u) => (G.token ? `${u}${u.includes('?') ? '&' : '?'}g=${encodeURIComponent(G.token)}` : u);
function setGuest(token, doc) { G.token = token || ''; G.doc = doc || ''; try { if (token) localStorage.setItem('nrf-guest', JSON.stringify(G)); else localStorage.removeItem('nrf-guest'); } catch {} }
async function api(path, opt = {}) {
  if (opt.body !== undefined && S.actAs && /^docs\/[a-f0-9]{12}\/(edit|para|table|comments)$/.test(path)) opt = { ...opt, body: { ...opt.body, as: S.actAs } };
  const gh = G.token ? { 'x-nrf-guest': G.token } : {};
  const r = await fetch('/api/nrf/' + path, opt.body !== undefined ? { method: opt.method || 'POST', headers: { 'content-type': 'application/json', ...gh }, body: JSON.stringify(opt.body) } : { method: opt.method || 'GET', headers: gh });
  let j;
  if (opt.onBytes && r.body && r.ok) {          // 큰 응답: 받는 양을 알리며 읽는다
    const total = Number(r.headers.get('content-length')) || 0; const rd = r.body.getReader(); const parts = []; let got = 0;
    for (;;) { const { done, value } = await rd.read(); if (done) break; parts.push(value); got += value.length; opt.onBytes(got, total); }
    const all = new Uint8Array(got); let o = 0; for (const c of parts) { all.set(c, o); o += c.length; }
    try { j = JSON.parse(new TextDecoder().decode(all)); } catch { j = {}; }
  } else j = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(j.error || `오류 ${r.status}`); e.status = r.status; e.data = j; throw e; }
  return j;
}
// 진행 상황과 상세 기록: 올리기·불러오기의 단계마다 한 줄씩(걸린 시간과 함께) 남긴다
const PL = { t0: 0, timer: 0, job: '', srv: 0, busy: false, tick: 0 };
const fmtBytes = (n) => (n >= 1048576 ? `${(n / 1048576).toFixed(1)}MB` : n >= 1024 ? `${Math.round(n / 1024)}KB` : `${n}B`);
function progStart(title) {
  clearTimeout(PL.timer); clearInterval(PL.tick);
  PL.t0 = performance.now(); PL.srv = 0; PL.busy = true;
  const p = $('prog'); p.hidden = false; p.className = ''; $('progBtn').hidden = true;
  p.querySelector('.ph b').textContent = title; p.querySelector('.log').innerHTML = ''; p.querySelector('.bar i').style.width = '2%';
  const clock = () => { p.querySelector('.ph span').textContent = `${((performance.now() - PL.t0) / 1000).toFixed(1)}초`; };
  clock(); PL.tick = setInterval(clock, 100);
}
// key 가 같은 줄은 덧쓴다(퍼센트가 오르는 줄)
function progLog(msg, pct, key, err, rowPct) {
  const p = $('prog'); if (p.hidden && !PL.busy) return;
  const log = p.querySelector('.log'); const stamp = `<em>${((performance.now() - PL.t0) / 1000).toFixed(2).padStart(6)}s</em>`;
  let row = key ? log.querySelector(`[data-k="${key}"]`) : null;
  if (!row) { row = document.createElement('div'); if (key) row.dataset.k = key; log.appendChild(row); }
  row.className = err ? 'e' : ''; row.innerHTML = stamp + esc(msg) + (typeof rowPct === 'number' ? `<span class="rb"><i style="width:${Math.max(0, Math.min(100, rowPct))}%"></i></span>` : ''); log.scrollTop = log.scrollHeight;
  if (typeof pct === 'number') p.querySelector('.bar i').style.width = `${Math.max(2, Math.min(100, pct))}%`;
}
function progDone(msg, ok = true) {
  progLog(msg, 100, null, !ok); PL.busy = false; PL.job = ''; clearInterval(PL.tick);
  const p = $('prog'); p.classList.add(ok ? 'ok' : 'err'); p.querySelector('.ph span').textContent = `${((performance.now() - PL.t0) / 1000).toFixed(1)}초`;

$('prog').querySelector('.ph button').onclick = () => { $('prog').hidden = true; $('progBtn').hidden = !$('prog').querySelector('.log').children.length; };
$('prog').onmouseleave = () => { if (!PL.busy && $('prog').classList.contains('err')) { clearTimeout(PL.timer); PL.timer = setTimeout(() => { $('prog').hidden = true; $('progBtn').hidden = false; }, 2500); } };

const nextFrame = () => new Promise((r) => requestAnimationFrame(() => setTimeout(r, 0)));

function ago(ts) { const s = (Date.now() - ts) / 1000; if (s < 60) return '방금'; if (s < 3600) return `${Math.floor(s / 60)}분 전`; if (s < 86400) return `${Math.floor(s / 3600)}시간 전`; const d = new Date(ts); return `${d.getMonth() + 1}.${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; }
const author = (email) => S.authors.find((a) => a.email === email) || (S.meInfo && email === S.meInfo.email && { email, name: S.meInfo.name, color: 7 }) || { email, name: email === 'ana' ? 'ANA' : email.split('@')[0], color: 7 };
const A_HEX = ['#d6336c', '#1c7ed6', '#2f9e44', '#e8590c', '#7048e8', '#0c8599', '#a61e4d', '#5c940d'];   // --a0…--a7 와 같은 값(색 고르기 칸의 처음 값)
const cv = (a) => a.hex || `var(--a${a.color})`;            // 관리자가 정한 색이 있으면 그 색, 없으면 차례대로 주는 색
const colorOf = (email) => cv(author(email));

// ---------- 조각(segs) ----------
const baseSegs = (t) => (t ? [{ t, o: 0 }] : []);
const segsOf = (k) => (S.paras[k] ? S.paras[k].segs : baseSegs((S.nodes.get(k) || {}).t || ''));
const finalOf = (segs) => segs.filter((s) => !s.del).map((s) => s.t).join('');

// ---------- 문서 그리기 ----------
function shapeCss(id) {
  const c = S.view.charShapes[id]; if (!c) return '';
  let s = `font-size:${(c.h || 1000) / 100}pt;`;
  if (c.b) s += 'font-weight:700;'; if (c.i) s += 'font-style:italic;'; if (c.u) s += 'text-decoration:underline;'; if (c.c) s += `color:${c.c};`;
  if (c.ff) s += `font-family:${c.ff.replace(/["<>&;]/g, '')};`; else if (c.f) s += `font-family:'${c.f.replace(/['"<>&;]/g, '')}',inherit;`;

}
function fmtCss(f) {
  if (!f) return ''; let s = '';
  if (f.sz) s += `font-size:${f.sz[0] / 100}pt;`; if (f.b) s += `font-weight:${f.b[0] ? 700 : 400};`; if (f.i) s += `font-style:${f.i[0] ? 'italic' : 'normal'};`;

// ---------- 표현점검 메모 ----------
S.notes = []; S.check = null; S.source = null; S.srcF = 'all'; S.navTab = 'all'; S.tagF = 'all'; S.xpShow = (() => { try { return localStorage.getItem('docs-xp') || 'all'; } catch { return 'all'; } })();
