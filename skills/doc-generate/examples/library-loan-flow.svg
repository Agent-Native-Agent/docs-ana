<svg xmlns="http://www.w3.org/2000/svg" class="dg dg-flow" viewBox="0 0 438 530" role="img" aria-label="도서 대출 처리: 시작 → 유효한 회원?, 유효한 회원? → 회원 등록(아니요), 회원 등록 → 시작(다시 확인), 유효한 회원? → 대출 권수 남음?(예), 대출 권수 남음? → 반납 안내(아니요), 대출 권수 남음? → 대출 처리(예), 대출 처리 → 끝"><style>/* 다이어그램 테마 — 색은 모두 토큰(var)으로만 쓴다. 밝은·어두운 화면을 토큰만 바꿔 맞춘다. 이미 디자인 토큰이 있는 앱에 넣을 때는 :root 블록을 지우고 앱 토큰 이름(--surface, --text, --acc …)에 맞춘다. */ :root { --surface: #FFFFFF; --surface-2: #F9FAFB; --text: #191F28; --text-sub: #4E5968; --text-weak: #6B7684; --line: #E5E8EB; --acc: #3182F6; --acc-strong: #1B64DA; --acc-weak: #E8F1FE; --map-bg: #FFF6E5; --map-line: #E8A33D; --zone-b: #EEF5FF; } @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --surface: #1F2126; --surface-2: #25272E; --text: #F2F4F6; --text-sub: #C2C7CE; --text-weak: #97A1AD; --line: #2E3138; --acc: #5C9DFF; --acc-strong: #9CC2FF; --acc-weak: #16335C; --map-bg: #3A2A10; --map-line: #D99A3A; --zone-b: #172A45; } } :root[data-theme="dark"] { --surface: #1F2126; --surface-2: #25272E; --text: #F2F4F6; --text-sub: #C2C7CE; --text-weak: #97A1AD; --line: #2E3138; --acc: #5C9DFF; --acc-strong: #9CC2FF; --acc-weak: #16335C; --map-bg: #3A2A10; --map-line: #D99A3A; --zone-b: #172A45; } /* 그림 크기: 넓은 그림은 PC, 세로 그림은 휴대폰(640px 이하) */ .dg { display: block; width: 100%; height: auto; margin: 4px auto 0; } .dg-wide { max-width: 1040px; } .dg-tall { display: none; max-width: 420px; } /* 상자 */ .dg-box { fill: var(--surface-2); stroke: var(--line); stroke-width: 1.5; } .dg-core { fill: var(--acc-weak); stroke: var(--acc); stroke-width: 1.5; } .dg-inner { fill: var(--surface); stroke: var(--acc); stroke-width: 1; stroke-opacity: .55; } .dg-ext { fill: var(--surface); stroke: var(--text-weak); stroke-width: 1.4; stroke-dasharray: 5 4; } /* 글자 */ .dg text { fill: var(--text); font-family: inherit; } .dg .dg-title { font-size: 19px; font-weight: 900; } .dg .dg-t { font-size: 13.5px; font-weight: 800; } .dg .dg-sub { font-size: 11.5px; fill: var(--text-sub); } .dg .dg-note { font-size: 11.5px; fill: var(--acc-strong); font-weight: 700; } /* 화살표 위 라벨: 바탕색 테두리(halo)로 선 위에서도 읽힌다 */ .dg .dg-lbl { font-size: 11.5px; font-weight: 700; fill: var(--text-sub); paint-order: stroke; stroke: var(--surface); stroke-width: 5px; stroke-linejoin: round; } /* 선 */ .dg-arrow { stroke: var(--text-weak); stroke-width: 1.6; fill: none; } .dg-headfill { fill: var(--text-weak); } .dg-dash { stroke-dasharray: 5 4; } .dg-dot { fill: var(--text-weak); } /* 순서도·관계도 전용 */ .dg-flowwrap { overflow-x: auto; -webkit-overflow-scrolling: touch; } .dg-flow { display: block; width: 100%; height: auto; } .dg-map { fill: var(--map-bg); stroke: var(--map-line); stroke-width: 1.5; } /* 분류·통계처럼 '모아 보는 것' */ .dg-term { fill: var(--surface); stroke: var(--acc); stroke-width: 1.6; } /* 시작·끝 */ .dg-relbox { fill: var(--surface); stroke: var(--acc); stroke-width: 1.6; } /* 마름모: 판단·연결 */ .dg-zone { fill: var(--surface-2); stroke: none; } .dg-zone.b { fill: var(--zone-b); fill-opacity: .55; } .dg .dg-zt { font-size: 12.5px; font-weight: 800; fill: var(--text-sub); } /* 관계 수(1 · n · 0..1)와 위쪽 알림 띠 */ .dg .dg-card { font-size: 12px; font-weight: 900; fill: var(--acc-strong); paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; } .dg-nnpill { fill: var(--acc); } .dg .dg-nn { font-size: 12px; font-weight: 900; fill: #fff; } .dg-table { width: 100%; border-collapse: collapse; font-size: 13px; } .dg-table th, .dg-table td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; } .dg-table th { color: var(--text-sub); font-weight: 800; font-size: 12.5px; } .dg-table td.k { white-space: nowrap; font-weight: 800; color: var(--acc-strong); } .dg-table td:first-child, .dg-table th:first-child { min-width: 6.5em; }  svg{background:var(--surface);font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",sans-serif}</style><defs><marker id="library-loan-flow-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dg-headfill"/></marker></defs><rect x="24" y="16" width="170" height="52" rx="26" class="dg-term"/><text x="109" y="36.5" class="dg-t" text-anchor="middle">시작</text><text x="109" y="53.5" class="dg-sub" text-anchor="middle">회원증·도서 제시</text><polygon points="109,108 194,150 109,192 24,150" class="dg-relbox"/><text x="109" y="155" class="dg-t" text-anchor="middle">유효한 회원?</text><rect x="244" y="108" width="170" height="84" rx="12" class="dg-box"/><text x="329" y="144.5" class="dg-t" text-anchor="middle">회원 등록</text><text x="329" y="161.5" class="dg-sub" text-anchor="middle">신분 확인 · 회원증 발급</text><polygon points="109,232 194,274 109,316 24,274" class="dg-relbox"/><text x="109" y="279" class="dg-t" text-anchor="middle">대출 권수 남음?</text><rect x="244" y="232" width="170" height="84" rx="12" class="dg-box"/><text x="329" y="268.5" class="dg-t" text-anchor="middle">반납 안내</text><text x="329" y="285.5" class="dg-sub" text-anchor="middle">연체·대출 중인 도서 확인</text><rect x="24" y="356" width="170" height="62" rx="12" class="dg-core"/><text x="109" y="381.5" class="dg-t" text-anchor="middle">대출 처리</text><text x="109" y="398.5" class="dg-sub" text-anchor="middle">도서 바코드 · 반납일 지정</text><rect x="24" y="458" width="170" height="56" rx="28" class="dg-term"/><text x="109" y="480.5" class="dg-t" text-anchor="middle">끝</text><text x="109" y="497.5" class="dg-sub" text-anchor="middle">반납일 문자 안내</text><path d="M109,68 V108" class="dg-arrow" marker-end="url(#library-loan-flow-head)"/><path d="M194,150 H244" class="dg-arrow" marker-end="url(#library-loan-flow-head)"/><path d="M329,108 V42 H194" class="dg-arrow" marker-end="url(#library-loan-flow-head)"/><path d="M109,192 V232" class="dg-arrow" marker-end="url(#library-loan-flow-head)"/><path d="M194,274 H244" class="dg-arrow" marker-end="url(#library-loan-flow-head)"/><path d="M109,316 V356" class="dg-arrow" marker-end="url(#library-loan-flow-head)"/><path d="M109,418 V458" class="dg-arrow" marker-end="url(#library-loan-flow-head)"/><text x="219" y="143" class="dg-lbl" text-anchor="middle">아니요</text><text x="338" y="79" class="dg-lbl" text-anchor="start">다시 확인</text><text x="118" y="216" class="dg-lbl" text-anchor="start">예</text><text x="219" y="267" class="dg-lbl" text-anchor="middle">아니요</text><text x="118" y="340" class="dg-lbl" text-anchor="start">예</text></svg>