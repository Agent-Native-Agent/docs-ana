<svg xmlns="http://www.w3.org/2000/svg" class="dg dg-wide" viewBox="0 0 1040 524" role="img" aria-label="개념도: 고객, 상점 관리자, 고객 · 관리자이(가) 온라인 주문 시스템의 단계(주문 접수, 결제 확인, 재고 확인, 배송 요청, 알림 · 정산)를 쓴다. 바깥 시스템: 결제 서비스(결제 확인 단계와 주고받음), 택배사(배송 요청 단계와 주고받음)"><style>/* 다이어그램 테마 — 색은 모두 토큰(var)으로만 쓴다. 밝은·어두운 화면을 토큰만 바꿔 맞춘다. 이미 디자인 토큰이 있는 앱에 넣을 때는 :root 블록을 지우고 앱 토큰 이름(--surface, --text, --acc …)에 맞춘다. */ :root { --surface: #FFFFFF; --surface-2: #F9FAFB; --text: #191F28; --text-sub: #4E5968; --text-weak: #6B7684; --line: #E5E8EB; --acc: #3182F6; --acc-strong: #1B64DA; --acc-weak: #E8F1FE; --map-bg: #FFF6E5; --map-line: #E8A33D; --zone-b: #EEF5FF; } @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --surface: #1F2126; --surface-2: #25272E; --text: #F2F4F6; --text-sub: #C2C7CE; --text-weak: #97A1AD; --line: #2E3138; --acc: #5C9DFF; --acc-strong: #9CC2FF; --acc-weak: #16335C; --map-bg: #3A2A10; --map-line: #D99A3A; --zone-b: #172A45; } } :root[data-theme="dark"] { --surface: #1F2126; --surface-2: #25272E; --text: #F2F4F6; --text-sub: #C2C7CE; --text-weak: #97A1AD; --line: #2E3138; --acc: #5C9DFF; --acc-strong: #9CC2FF; --acc-weak: #16335C; --map-bg: #3A2A10; --map-line: #D99A3A; --zone-b: #172A45; } /* 그림 크기: 넓은 그림은 PC, 세로 그림은 휴대폰(640px 이하) */ .dg { display: block; width: 100%; height: auto; margin: 4px auto 0; } .dg-wide { max-width: 1040px; } /* 상자 */ .dg-box { fill: var(--surface-2); stroke: var(--line); stroke-width: 1.5; } .dg-core { fill: var(--acc-weak); stroke: var(--acc); stroke-width: 1.5; } .dg-inner { fill: var(--surface); stroke: var(--acc); stroke-width: 1; stroke-opacity: .55; } .dg-ext { fill: var(--surface); stroke: var(--text-weak); stroke-width: 1.4; stroke-dasharray: 5 4; } /* 글자 */ .dg text { fill: var(--text); font-family: inherit; } .dg .dg-title { font-size: 19px; font-weight: 900; } .dg .dg-t { font-size: 13.5px; font-weight: 800; } .dg .dg-sub { font-size: 11.5px; fill: var(--text-sub); } .dg .dg-note { font-size: 11.5px; fill: var(--acc-strong); font-weight: 700; } /* 화살표 위 라벨: 바탕색 테두리(halo)로 선 위에서도 읽힌다 */ .dg .dg-lbl { font-size: 11.5px; font-weight: 700; fill: var(--text-sub); paint-order: stroke; stroke: var(--surface); stroke-width: 5px; stroke-linejoin: round; } /* 선 */ .dg-arrow { stroke: var(--text-weak); stroke-width: 1.6; fill: none; } .dg-headfill { fill: var(--text-weak); } .dg-dash { stroke-dasharray: 5 4; } .dg-dot { fill: var(--text-weak); }  svg{background:var(--surface);font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",sans-serif}</style><defs><marker id="online-order-concept-wide-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dg-headfill"/></marker></defs><rect x="300" y="20" width="440" height="488" rx="18" class="dg-core"/><text x="520" y="54" class="dg-title" text-anchor="middle">온라인 주문 시스템</text><text x="520" y="74" class="dg-sub" text-anchor="middle">상점의 주문 · 결제 · 배송 관리</text><rect x="324" y="100" width="392" height="54" rx="10" class="dg-inner"/><text x="520" y="122" class="dg-t" text-anchor="middle">① 주문 접수</text><text x="520" y="141" class="dg-sub" text-anchor="middle">상품 · 수량 · 배송지 확인</text><path d="M520,154 V174" class="dg-arrow" marker-end="url(#online-order-concept-wide-head)"/><rect x="324" y="176" width="392" height="54" rx="10" class="dg-inner"/><text x="520" y="198" class="dg-t" text-anchor="middle">② 결제 확인</text><text x="520" y="217" class="dg-sub" text-anchor="middle">결제 요청 · 승인 결과 기록</text><path d="M520,230 V250" class="dg-arrow" marker-end="url(#online-order-concept-wide-head)"/><rect x="324" y="252" width="392" height="54" rx="10" class="dg-inner"/><text x="520" y="274" class="dg-t" text-anchor="middle">③ 재고 확인</text><text x="520" y="293" class="dg-sub" text-anchor="middle">재고 차감 · 품절 알림</text><path d="M520,306 V326" class="dg-arrow" marker-end="url(#online-order-concept-wide-head)"/><rect x="324" y="328" width="392" height="54" rx="10" class="dg-inner"/><text x="520" y="350" class="dg-t" text-anchor="middle">④ 배송 요청</text><text x="520" y="369" class="dg-sub" text-anchor="middle">송장 발급 · 배송 상태 추적</text><path d="M520,382 V402" class="dg-arrow" marker-end="url(#online-order-concept-wide-head)"/><rect x="324" y="404" width="392" height="54" rx="10" class="dg-inner"/><text x="520" y="426" class="dg-t" text-anchor="middle">⑤ 알림 · 정산</text><text x="520" y="445" class="dg-sub" text-anchor="middle">주문 상태 알림 · 매출 정산</text><text x="520" y="488" class="dg-note" text-anchor="middle">개인정보는 암호화해 보관 · 결제 정보는 저장하지 않음</text><rect x="20" y="100" width="176" height="130" rx="10" class="dg-box"/><text x="108" y="151" class="dg-t" text-anchor="middle">고객</text><text x="108" y="173" class="dg-sub" text-anchor="middle">주문 · 결제</text><text x="108" y="191" class="dg-sub" text-anchor="middle">배송 조회</text><path d="M196,127 H322" class="dg-arrow" marker-end="url(#online-order-concept-wide-head)"/><text x="260" y="119" class="dg-lbl" text-anchor="middle">주문</text><path d="M196,203 H322" class="dg-arrow" marker-end="url(#online-order-concept-wide-head)"/><text x="260" y="195" class="dg-lbl" text-anchor="middle">결제</text><rect x="20" y="252" width="176" height="54" rx="10" class="dg-box"/><text x="108" y="276" class="dg-t" text-anchor="middle">상점 관리자</text><text x="108" y="295" class="dg-sub" text-anchor="middle">재고 · 상품 관리</text><path d="M196,279 H322" class="dg-arrow" marker-end="url(#online-order-concept-wide-head)"/><text x="260" y="271" class="dg-lbl" text-anchor="middle">재고 등록</text><rect x="20" y="404" width="176" height="54" rx="10" class="dg-box"/><text x="108" y="428" class="dg-t" text-anchor="middle">고객 · 관리자</text><text x="108" y="447" class="dg-sub" text-anchor="middle">알림 · 정산 확인</text><path d="M198,431 H322" class="dg-arrow" marker-end="url(#online-order-concept-wide-head)" marker-start="url(#online-order-concept-wide-head)"/><text x="260" y="423" class="dg-lbl" text-anchor="middle">확인</text><text x="260" y="449" class="dg-lbl" text-anchor="middle">알림</text><rect x="844" y="163" width="180" height="80" rx="10" class="dg-ext"/><text x="934" y="189" class="dg-t" text-anchor="middle">결제 서비스</text><text x="934" y="209" class="dg-sub" text-anchor="middle">카드 · 간편결제</text><path d="M716,194 H842" class="dg-arrow" marker-end="url(#online-order-concept-wide-head)"/><text x="792" y="187" class="dg-lbl" text-anchor="middle">결제 요청</text><path d="M844,212 H718" class="dg-arrow" marker-end="url(#online-order-concept-wide-head)"/><text x="792" y="230" class="dg-lbl" text-anchor="middle">승인 결과</text><rect x="844" y="315" width="180" height="80" rx="10" class="dg-ext"/><text x="934" y="341" class="dg-t" text-anchor="middle">택배사</text><text x="934" y="361" class="dg-sub" text-anchor="middle">배송 접수 · 조회</text><path d="M716,346 H842" class="dg-arrow" marker-end="url(#online-order-concept-wide-head)"/><text x="792" y="339" class="dg-lbl" text-anchor="middle">배송 요청</text><path d="M844,364 H718" class="dg-arrow" marker-end="url(#online-order-concept-wide-head)"/><text x="792" y="382" class="dg-lbl" text-anchor="middle">송장 번호</text></svg>