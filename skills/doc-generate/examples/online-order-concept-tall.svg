<svg xmlns="http://www.w3.org/2000/svg" class="dg dg-tall" viewBox="0 0 360 608" role="img" aria-label="개념도: 고객, 상점 관리자, 고객 · 관리자이(가) 온라인 주문 시스템의 단계(주문 접수, 결제 확인, 재고 확인, 배송 요청, 알림 · 정산)를 쓴다. 바깥 시스템: 결제 서비스(결제 확인 단계와 주고받음), 택배사(배송 요청 단계와 주고받음)"><style>/* 다이어그램 테마 — 색은 모두 토큰(var)으로만 쓴다. 밝은·어두운 화면을 토큰만 바꿔 맞춘다. 이미 디자인 토큰이 있는 앱에 넣을 때는 :root 블록을 지우고 앱 토큰 이름(--surface, --text, --acc …)에 맞춘다. */ :root { --surface: #FFFFFF; --surface-2: #F9FAFB; --text: #191F28; --text-sub: #4E5968; --text-weak: #6B7684; --line: #E5E8EB; --acc: #3182F6; --acc-strong: #1B64DA; --acc-weak: #E8F1FE; --map-bg: #FFF6E5; --map-line: #E8A33D; --zone-b: #EEF5FF; } @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --surface: #1F2126; --surface-2: #25272E; --text: #F2F4F6; --text-sub: #C2C7CE; --text-weak: #97A1AD; --line: #2E3138; --acc: #5C9DFF; --acc-strong: #9CC2FF; --acc-weak: #16335C; --map-bg: #3A2A10; --map-line: #D99A3A; --zone-b: #172A45; } } :root[data-theme="dark"] { --surface: #1F2126; --surface-2: #25272E; --text: #F2F4F6; --text-sub: #C2C7CE; --text-weak: #97A1AD; --line: #2E3138; --acc: #5C9DFF; --acc-strong: #9CC2FF; --acc-weak: #16335C; --map-bg: #3A2A10; --map-line: #D99A3A; --zone-b: #172A45; } /* 그림 크기: 넓은 그림은 PC, 세로 그림은 휴대폰(640px 이하) */ .dg { display: block; width: 100%; height: auto; margin: 4px auto 0; } .dg-wide { max-width: 1040px; } /* 상자 */ .dg-box { fill: var(--surface-2); stroke: var(--line); stroke-width: 1.5; } .dg-core { fill: var(--acc-weak); stroke: var(--acc); stroke-width: 1.5; } .dg-inner { fill: var(--surface); stroke: var(--acc); stroke-width: 1; stroke-opacity: .55; } .dg-ext { fill: var(--surface); stroke: var(--text-weak); stroke-width: 1.4; stroke-dasharray: 5 4; } /* 글자 */ .dg text { fill: var(--text); font-family: inherit; } .dg .dg-title { font-size: 19px; font-weight: 900; } .dg .dg-t { font-size: 13.5px; font-weight: 800; } .dg .dg-sub { font-size: 11.5px; fill: var(--text-sub); } .dg .dg-note { font-size: 11.5px; fill: var(--acc-strong); font-weight: 700; } /* 화살표 위 라벨: 바탕색 테두리(halo)로 선 위에서도 읽힌다 */ .dg .dg-lbl { font-size: 11.5px; font-weight: 700; fill: var(--text-sub); paint-order: stroke; stroke: var(--surface); stroke-width: 5px; stroke-linejoin: round; } /* 선 */ .dg-arrow { stroke: var(--text-weak); stroke-width: 1.6; fill: none; } .dg-headfill { fill: var(--text-weak); } .dg-dash { stroke-dasharray: 5 4; } .dg-dot { fill: var(--text-weak); }  svg{background:var(--surface);font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",sans-serif}</style><defs><marker id="online-order-concept-tall-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dg-headfill"/></marker></defs><rect x="16" y="8" width="328" height="56" rx="10" class="dg-box"/><text x="180" y="30" class="dg-t" text-anchor="middle">사용하는 사람</text><text x="180" y="50" class="dg-sub" text-anchor="middle">고객 · 상점 관리자</text><path d="M130,64 V94" class="dg-arrow" marker-end="url(#online-order-concept-tall-head)"/><text x="140" y="84" class="dg-lbl" text-anchor="start">주문 · 관리</text><rect x="12" y="96" width="236" height="500" rx="18" class="dg-core"/><text x="130" y="126" class="dg-title" text-anchor="middle">온라인 주문 시스템</text><text x="130" y="144" class="dg-sub" text-anchor="middle">주문 · 결제 · 배송 관리</text><rect x="26" y="156" width="208" height="62" rx="10" class="dg-inner"/><text x="130" y="177" class="dg-t" text-anchor="middle">① 주문 접수</text><text x="130" y="195" class="dg-sub" text-anchor="middle">상품 · 수량</text><text x="130" y="210" class="dg-sub" text-anchor="middle">배송지 확인</text><path d="M130,218 V234" class="dg-arrow" marker-end="url(#online-order-concept-tall-head)"/><rect x="26" y="236" width="208" height="62" rx="10" class="dg-inner"/><text x="130" y="257" class="dg-t" text-anchor="middle">② 결제 확인</text><text x="130" y="275" class="dg-sub" text-anchor="middle">결제 요청</text><text x="130" y="290" class="dg-sub" text-anchor="middle">승인 결과 기록</text><path d="M130,298 V314" class="dg-arrow" marker-end="url(#online-order-concept-tall-head)"/><rect x="26" y="316" width="208" height="62" rx="10" class="dg-inner"/><text x="130" y="337" class="dg-t" text-anchor="middle">③ 재고 확인</text><text x="130" y="355" class="dg-sub" text-anchor="middle">재고 차감</text><text x="130" y="370" class="dg-sub" text-anchor="middle">품절 알림</text><path d="M130,378 V394" class="dg-arrow" marker-end="url(#online-order-concept-tall-head)"/><rect x="26" y="396" width="208" height="62" rx="10" class="dg-inner"/><text x="130" y="417" class="dg-t" text-anchor="middle">④ 배송 요청</text><text x="130" y="435" class="dg-sub" text-anchor="middle">송장 발급</text><text x="130" y="450" class="dg-sub" text-anchor="middle">배송 상태 추적</text><path d="M130,458 V474" class="dg-arrow" marker-end="url(#online-order-concept-tall-head)"/><rect x="26" y="476" width="208" height="62" rx="10" class="dg-inner"/><text x="130" y="497" class="dg-t" text-anchor="middle">⑤ 알림 · 정산</text><text x="130" y="515" class="dg-sub" text-anchor="middle">주문 상태 알림</text><text x="130" y="530" class="dg-sub" text-anchor="middle">매출 정산</text><text x="130" y="564" class="dg-note" text-anchor="middle">개인정보 암호화</text><text x="130" y="580" class="dg-note" text-anchor="middle">결제 정보는 저장하지 않음</text><rect x="264" y="221" width="84" height="92" rx="10" class="dg-ext"/><text x="306" y="243" class="dg-t" text-anchor="middle">결제 서비스</text><text x="306" y="261" class="dg-sub" text-anchor="middle">카드 결제</text><text x="306" y="283" class="dg-lbl" text-anchor="middle">→ 결제 요청</text><text x="306" y="300" class="dg-lbl" text-anchor="middle">← 승인 결과</text><path d="M236,267 H262" class="dg-arrow" marker-end="url(#online-order-concept-tall-head)" marker-start="url(#online-order-concept-tall-head)"/><rect x="264" y="381" width="84" height="92" rx="10" class="dg-ext"/><text x="306" y="403" class="dg-t" text-anchor="middle">택배사</text><text x="306" y="421" class="dg-sub" text-anchor="middle">배송 접수</text><text x="306" y="443" class="dg-lbl" text-anchor="middle">→ 배송 요청</text><text x="306" y="460" class="dg-lbl" text-anchor="middle">← 송장 번호</text><path d="M236,427 H262" class="dg-arrow" marker-end="url(#online-order-concept-tall-head)" marker-start="url(#online-order-concept-tall-head)"/></svg>